[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-header"
version = "0.8.0-dev"
description = "A Python CLI tool for analyzing HTTP response headers and identifying security issues."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

authors = [
    { name = "Sriram", email = "sriram060106@gmail.com" }
]

keywords = [
    "http",
    "https",
    "headers",
    "security",
    "cybersecurity",
    "cli",
    "pentesting",
    "web-security",
    "header-analysis"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries"
]

dependencies = [
    "requests>=2.32.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.0"
]

[project.urls]
Homepage = "https://github.com/heyshreee/argus-header"
Repository = "https://github.com/heyshreee/argus-header"
Issues = "https://github.com/heyshreee/argus-header/issues"

[project.scripts]
argus-header = "argus_header.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
argus_header = ["*.json"]